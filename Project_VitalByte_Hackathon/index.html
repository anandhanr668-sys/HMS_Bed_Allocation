<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medibed - Hospital Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div id="root">
    <div style="padding: 40px; text-align: center; font-family: sans-serif;">
      <h2 style="color: #2563eb;">Initializing Medibed...</h2>
      <p style="color: #64748b;">If this screen persists, please check your network connection.</p>
    </div>
  </div>

  <script>
    console.log("Diagnostic Script Running");
    window.onerror = function (msg, url, line, col, error) {
      document.body.innerHTML = '<div style="color:red; padding:20px; font-family:sans-serif;">' +
        '<h1>Diagnostic Error</h1>' +
        '<p>' + msg + '</p>' +
        '<p>At: ' + url + ':' + line + '</p>' +
        '<button onclick="location.reload()">Retry</button>' +
        '</div>';
    };
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
